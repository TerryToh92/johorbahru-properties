<style>
/* Business logo watermark */
#logo-watermark {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 200;
  background: #ffffff;
  border-radius: 6px;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 2px 10px rgba(0,0,0,.25);
}
#logo-watermark img {
  height: 36px;
  width: auto;
  display: block;
}
#logo-watermark .logo-text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}
#logo-watermark .logo-text strong {
  font-family: Georgia, serif;
  font-size: 12px;
  color: #101928;
  font-weight: 700;
}
#logo-watermark .logo-text span {
  font-family: Arial, sans-serif;
  font-size: 9px;
  color: #7090b8;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ===== HOTSPOT: always-visible label chips ===== */

/* Header box — force fully expanded, never the small circle */
.info-hotspot .info-hotspot-header,
.desktop .info-hotspot .info-hotspot-header,
.mobile .info-hotspot .info-hotspot-header,
.desktop.no-touch .info-hotspot .info-hotspot-header {
  width: 220px !important;
  height: 36px !important;
  border-radius: 4px !important;
  background: #101928 !important;
  border: 2px solid #c07d1a !important;
  box-shadow: 0 4px 16px rgba(0,0,0,.55) !important;
  transition: none !important;
  padding: 0 !important;
  opacity: 1 !important;
}

/* Gold "i" icon chip */
.info-hotspot .info-hotspot-icon-wrapper,
.desktop .info-hotspot .info-hotspot-icon-wrapper,
.mobile .info-hotspot .info-hotspot-icon-wrapper {
  width: 32px !important;
  height: 32px !important;
  background: #c07d1a !important;
  border-radius: 3px !important;
  position: absolute !important;
  left: 0 !important;
  top: 0 !important;
}
.info-hotspot .info-hotspot-icon {
  width: 18px !important;
  height: 18px !important;
  margin: 7px !important;
}

/* Title wrapper — override width:0;overflow:hidden with correct specificity */
.info-hotspot .info-hotspot-title-wrapper,
.desktop .info-hotspot .info-hotspot-title-wrapper,
.mobile .info-hotspot .info-hotspot-title-wrapper,
.desktop.no-touch .info-hotspot .info-hotspot-header:hover .info-hotspot-title-wrapper,
.desktop .info-hotspot.visible .info-hotspot-title-wrapper {
  width: 185px !important;
  height: 36px !important;
  padding: 0 8px 0 36px !important;
  overflow: visible !important;
  transition: none !important;
}
.info-hotspot .info-hotspot-title-wrapper:before {
  display: none !important;
}

/* Title text */
.info-hotspot .info-hotspot-title {
  font-family: Georgia, serif !important;
  font-size: 13px !important;
  font-weight: 700 !important;
  color: #fff !important;
  letter-spacing: .3px !important;
  line-height: 36px !important;
  white-space: nowrap !important;
  display: block !important;
  vertical-align: baseline !important;
}

/* Hide close button */
.info-hotspot .info-hotspot-close-wrapper,
.desktop .info-hotspot.visible .info-hotspot-close-wrapper {
  display: none !important;
  visibility: hidden !important;
}

/* Hide text body — title chip only */
.info-hotspot .info-hotspot-text,
.desktop .info-hotspot.visible .info-hotspot-text {
  display: none !important;
  visibility: hidden !important;
  transform: none !important;
}
</style>
</head>

<script>
// Add .visible to all hotspots so Marzipano's opacity rules fire
window.addEventListener('load', function() {
  function markVisible() {
    document.querySelectorAll('.info-hotspot').forEach(function(hs) {
      hs.classList.add('visible');
    });
  }
  markVisible();
  setTimeout(markVisible, 800);
  setTimeout(markVisible, 2000);
});
</script>
