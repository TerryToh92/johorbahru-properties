<style>
/* Business logo watermark */
#logo-watermark {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 200;
  background: rgba(255,255,255,.92);
  border-radius: 5px;
  padding: 5px 9px;
  display: flex;
  align-items: center;
  gap: 7px;
  box-shadow: 0 2px 10px rgba(0,0,0,.25);
}
#logo-watermark img { height: 28px; width: auto; display: block; }
#logo-watermark .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
#logo-watermark .logo-text strong { font-family: Georgia, serif; font-size: 11px; color: #101928; font-weight: 700; }
#logo-watermark .logo-text span { font-family: Arial, sans-serif; font-size: 8px; color: #7090b8; letter-spacing: 1px; text-transform: uppercase; }

/* ===== DROP PIN HOTSPOT LABELS ===== */
.info-hotspot .info-hotspot-header,
.desktop .info-hotspot .info-hotspot-header,
.mobile  .info-hotspot .info-hotspot-header {
  display: flex !important;
  align-items: center !important;
  gap: 7px !important;
  width: auto !important;
  height: auto !important;
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  border-radius: 0 !important;
  padding: 0 !important;
  opacity: 1 !important;
  transition: none !important;
}
.info-hotspot .info-hotspot-icon-wrapper,
.desktop .info-hotspot .info-hotspot-icon-wrapper,
.mobile  .info-hotspot .info-hotspot-icon-wrapper {
  width: 18px !important;
  height: 18px !important;
  background: #f5c030 !important;
  border-radius: 50% 50% 50% 0 !important;
  transform: rotate(-45deg) !important;
  border: 2px solid #fff !important;
  box-shadow: 0 2px 8px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.25) !important;
  flex-shrink: 0 !important;
  position: relative !important;
  left: auto !important;
  top: auto !important;
}
.info-hotspot .info-hotspot-icon { display: none !important; }
.info-hotspot .info-hotspot-title-wrapper,
.desktop .info-hotspot .info-hotspot-title-wrapper,
.mobile  .info-hotspot .info-hotspot-title-wrapper,
.desktop.no-touch .info-hotspot .info-hotspot-header:hover .info-hotspot-title-wrapper,
.desktop .info-hotspot.visible .info-hotspot-title-wrapper {
  width: auto !important;
  height: auto !important;
  padding: 0 !important;
  overflow: visible !important;
  transition: none !important;
}
.info-hotspot .info-hotspot-title-wrapper::before { display: none !important; }
.info-hotspot .info-hotspot-title {
  font-family: Arial, Helvetica, sans-serif !important;
  font-size: 13px !important;
  font-weight: 800 !important;
  color: #fff !important;
  text-shadow:
    0 0 4px rgba(0,0,0,1),
    0 1px 3px rgba(0,0,0,1),
    0 0 10px rgba(0,0,0,.8) !important;
  letter-spacing: .4px !important;
  line-height: 1 !important;
  white-space: nowrap !important;
  display: block !important;
}
.info-hotspot .info-hotspot-close-wrapper,
.desktop .info-hotspot.visible .info-hotspot-close-wrapper { display: none !important; visibility: hidden !important; }
.info-hotspot .info-hotspot-text,
.desktop .info-hotspot.visible .info-hotspot-text {
  display: block !important;
  visibility: visible !important;
  position: static !important;
  width: auto !important;
  max-height: none !important;
  height: auto !important;
  background: transparent !important;
  -ms-transform: none !important;
  -webkit-transform: none !important;
  transform: none !important;
  padding: 1px 0 0 25px !important;
  margin: 0 !important;
  font-family: Arial, Helvetica, sans-serif !important;
  font-size: 10px !important;
  font-weight: 400 !important;
  color: rgba(255,255,255,.72) !important;
  text-shadow: 0 0 4px rgba(0,0,0,1), 0 1px 3px rgba(0,0,0,1) !important;
  white-space: nowrap !important;
  overflow: visible !important;
  border-radius: 0 !important;
  line-height: 1.3 !important;
  transition: none !important;
  -webkit-transition: none !important;
}
</style>

<body class="single-scene ">

</div>

<div id="sceneList">

</div>

<div id="titleBar"><h1 class="sceneName"></h1></div>

<a href="javascript:void(0)" id="autorotateToggle">

</a>
<a href="javascript:void(0)" id="fullscreenToggle">
  <img class="icon off" src="img/fullscreen.png"><img class="icon on" src="img/windowed.png">

<a href="javascript:void(0)" id="sceneListToggle">

<script src="data.js"></script>
<script src="index.js"></script>
<script>
window.addEventListener('load', function() {
  function markVisible() {
    document.querySelectorAll('.info-hotspot').forEach(function(hs) {
      hs.classList.add('visible');
    });
  }
  markVisible();
  setTimeout(markVisible, 800);
  setTimeout(markVisible, 2000);

  var fsBtn = document.getElementById('fullscreenToggle');
  if (fsBtn) {
    document.body.classList.add('fullscreen-enabled');
    fsBtn.addEventListener('click', function() {
      if (!document.fullscreenElement) {
        (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    });
    document.addEventListener('fullscreenchange', function() {
      fsBtn.classList.toggle('enabled', !!document.fullscreenElement);
    });
    document.addEventListener('webkitfullscreenchange', function() {
      fsBtn.classList.toggle('enabled', !!document.webkitFullscreenElement);
    });
  }
});
</script>
